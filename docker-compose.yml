services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DOWNLOAD_DIR: /tmp/downloads
      MAX_DOWNLOAD_MB: "300"
      MAX_CONCURRENT_JOBS: "2"
      MAX_STORAGE_MB: "1024"
      TRUSTED_PROXY_HOPS: "0"
      # Pisahkan dengan koma. Default "*" hanya cocok untuk pengembangan lokal.
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    volumes:
      - download_tmp:/tmp/downloads
    restart: unless-stopped
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
volumes:
  download_tmp:

services:
  - type: web
    name: save-hack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: MAX_DOWNLOAD_MB
        value: "300"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_STORAGE_MB
        value: "512"
      - key: ALLOWED_ORIGINS
        value: "https://mujib-syarif.github.io"
      - key: TRUSTED_PROXY_HOPS
        value: "1"

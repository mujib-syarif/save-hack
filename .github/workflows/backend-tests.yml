name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Show versions
        run: python -c "import fastapi, yt_dlp; print('fastapi', fastapi.__version__, 'yt-dlp', yt_dlp.version.__version__)"
      - name: Lint
        working-directory: backend
        run: ruff check --select E9,F,B,S --ignore S101,S603,S607,S311,S104,B904,S110,S112 savehack main.py
      - name: Run tests (unit, security, API, real yt-dlp + FFmpeg integration)
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Docker image builds
        run: docker build -t save-hack-api backend
      - name: Container starts and /health answers
        run: |
          docker run -d --name api -e PORT=8123 -p 8123:8123 save-hack-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health > health.json; then cat health.json; break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          h = json.load(open("health.json"))
          assert h["ok"] and h["ffmpeg"] and h["engines"]["ytdlp"], h
          print("health ok:", h["yt_dlp_version"])
          PY
          docker logs api | tail -20
          docker rm -f api
